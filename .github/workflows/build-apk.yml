name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Unzip source
        run: unzip -q source.zip -d src

      - name: Build
        run: |
          GRADLEW=$(find src -name gradlew -type f | head -n 1)
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: BanglaCalendar-apk
          path: src/**/build/outputs/apk/release/*.apk
