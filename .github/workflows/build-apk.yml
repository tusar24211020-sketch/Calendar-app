name: Build Calendar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "source.zip"
      - "www/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source (ZIP or extracted folders)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source.zip ]; then
            mkdir -p "$RUNNER_TEMP/calendar-source"
            unzip -q source.zip -d "$RUNNER_TEMP/calendar-source"
            ROOT="$RUNNER_TEMP/calendar-source"
          else
            ROOT="$GITHUB_WORKSPACE"
          fi
          test -f "$ROOT/android/gradlew"
          test -f "$ROOT/www/index.html"
          echo "CALENDAR_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$CALENDAR_ROOT/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apk-output/Calendar.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendar-release-apk
          path: apk-output/Calendar.apk
          if-no-files-found: error
